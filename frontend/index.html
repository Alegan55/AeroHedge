<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroHedge Live Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AeroHedge Telemetry Stream</h1>
        <div class="chart-container">
            <canvas id="latencyChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('latencyChart').getContext('2d');
        let counter = 0;
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Latency (Cycles)', 
                    data: [], 
                    borderColor: '#00ff00', 
                    backgroundColor: 'rgba(0, 255, 0, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true 
                }] 
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                scales: { 
                    x: { display: false }, 
                    y: { 
                        beginAtZero: true, 
                        suggestedMax: 50,
                        grid: { color: '#222' }
                    } 
                } 
            }
        });

        const ws = new WebSocket("ws://localhost:3000/ws/telemetry");
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                chart.data.labels.push(counter++);
                chart.data.datasets[0].data.push(data.avg_latency_cycles);
                
                if (chart.data.labels.length > 60) { 
                    chart.data.labels.shift(); 
                    chart.data.datasets[0].data.shift(); 
                }
                chart.update('none');
            } catch (err) {
                console.error("Parse error:", err);
            }
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };
    </script>
</body>
</html>
